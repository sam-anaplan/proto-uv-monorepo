apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.ui.name }}-nginx-config
  labels:
    {{- include "uv-monorepo.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {}
    http {
      include mime.types;
      default_type application/octet-stream;

      server {
          listen 80;
          server_name localhost;

          root /usr/share/nginx/html/browser;
          index index.html;

          # Serve static files with correct MIME
          location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|json)$ {
              try_files $uri =404;
              access_log off;
          }

          # Reverse proxy: route /api/tasks/ to api-1
          location /api/tasks/ {
              proxy_pass http://{{ .Values.api1.name }}-service:{{ .Values.api1.port }}/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }

          # Reverse proxy: route /api/numbers/ to api-2
          location /api/numbers/ {
              proxy_pass http://{{ .Values.api2.name }}-service:{{ .Values.api2.port }}/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }

          # Angular SPA fallback
          location / {
              try_files $uri $uri/ /index.html;
          }
      }
    }
