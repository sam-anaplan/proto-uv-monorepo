apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api1.name }}-service
  labels:
    {{- include "uv-monorepo.labels" . | nindent 4 }}
    {{- include "uv-monorepo.selectorLabels" .Values.api1.name | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "uv-monorepo.selectorLabels" .Values.api1.name | nindent 4 }}
  ports:
    - port: {{ .Values.api1.port }}
      targetPort: {{ .Values.api1.port }}
      nodePort: {{ .Values.api1.nodePort }}
      protocol: TCP
