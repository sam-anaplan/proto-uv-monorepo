apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api1.name }}
  labels:
    {{- include "uv-monorepo.labels" . | nindent 4 }}
    {{- include "uv-monorepo.selectorLabels" .Values.api1.name | nindent 4 }}
spec:
  replicas: {{ .Values.api1.replicas }}
  selector:
    matchLabels:
      {{- include "uv-monorepo.selectorLabels" .Values.api1.name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uv-monorepo.selectorLabels" .Values.api1.name | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.api1.name }}
          image: "{{ .Values.api1.image }}:{{ .Values.api1.tag }}"
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.api1.port }}
          resources:
            {{- toYaml .Values.api1.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.api1.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.api1.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
